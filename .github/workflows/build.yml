name: Build APK

# Cách dùng: đẩy file AiManager.zip (source) + file này (.github/workflows/build.yml) lên repo.
# Workflow sẽ tự giải nén file .zip ở thư mục gốc repo rồi build ra APK đã ký.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Keystore tích hợp sẵn (base64). Giữ nguyên để các bản build sau cài đè (update) lên bản cũ.
      KEYSTORE_BASE64: ""
      KEYSTORE_PASSWORD: "AiManager@2026"
      KEY_ALIAS: "aimanager"
      KEY_PASSWORD: "AiManager@2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén source (.zip)
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file .zip ở thư mục gốc repo"
            exit 1
          fi
          echo "Giải nén: $ZIP"
          rm -rf _src
          mkdir _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Không thấy settings.gradle(.kts) trong file zip"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          find "$ROOT" -maxdepth 3 -not -path '*/.git/*' | sort | head -n 60

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Khôi phục keystore
        run: |
          mkdir -p "$PROJECT_ROOT/app/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_ROOT/app/keystore/aimanager.jks"
          keytool -list -keystore "$PROJECT_ROOT/app/keystore/aimanager.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 6

      - name: Build APK (release, đã ký)
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Đổi tên APK
        run: |
          mkdir -p dist
          cp "$PROJECT_ROOT"/app/build/outputs/apk/release/*.apk "dist/QuanLyAI-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Tải APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyAI-apk
          path: dist/*.apk
          if-no-files-found: error
..
